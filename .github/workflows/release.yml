name: Release APK

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag must be a semantic version such as 5.6.2 or v5.6.2"
            exit 1
          fi

          tag_version="${BASH_REMATCH[1]}"
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' buildSrc/src/main/java/com/heyanle/buildsrc/Android.kt | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' buildSrc/src/main/java/com/heyanle/buildsrc/Android.kt | head -n 1)"

          if [[ -z "${app_version}" || ! "${version_code}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unable to read a valid versionName/versionCode from Android.kt"
            exit 1
          fi

          if [[ "${tag_version}" != "${app_version}" ]]; then
            echo "::error::Tag version ${tag_version} does not match app version ${app_version}"
            exit 1
          fi

          release_note="$(grep -m 1 -v '^[[:space:]]*$' app/src/main/assets/update_log.txt || true)"
          if [[ "${release_note}" != *"${app_version}"* ]]; then
            echo "::error::The first release-note entry must contain version ${app_version}"
            exit 1
          fi

          previous_tag=''
          previous_version=''
          while IFS= read -r candidate; do
            if [[ "${candidate}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ &&
                  "${BASH_REMATCH[1]}" != "${tag_version}" ]]; then
              candidate_version="${BASH_REMATCH[1]}"
              latest_version="$(printf '%s\n%s\n' "${previous_version:-0.0.0}" "${candidate_version}" | sort -V | tail -n 1)"
              if [[ "${latest_version}" == "${candidate_version}" ]]; then
                previous_tag="${candidate}"
                previous_version="${candidate_version}"
              fi
            fi
          done < <(git tag --merged HEAD^)

          if [[ -n "${previous_tag}" ]]; then
            previous_android="$(git show "${previous_tag}:buildSrc/src/main/java/com/heyanle/buildsrc/Android.kt" 2>/dev/null || true)"
            previous_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' <<< "${previous_android}" | head -n 1)"
            if [[ "${previous_code}" =~ ^[1-9][0-9]*$ &&
                  "${version_code}" -le "${previous_code}" ]]; then
              echo "::error::versionCode ${version_code} must be greater than ${previous_code} from ${previous_tag}"
              exit 1
            fi
          fi

          echo "RELEASE_TAG=${tag_name}" >> "${GITHUB_ENV}"
          echo "BANGUMI_VERSION=${app_version}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"
          echo "APK_NAME=EasyBangumi-${app_version}.apk" >> "${GITHUB_ENV}"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > app/easybangumi.jks

      - name: Build signed release APK
        env:
          RELEASE: 'true'
          BUGLY_APPID: ${{ secrets.BUGLY_APPID || 'release' }}
          KEYSTORE_FILE: easybangumi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare and verify APK
        shell: bash
        run: |
          set -euo pipefail

          apk_source="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "${apk_source}" ]]; then
            echo "::error::Release APK was not generated"
            exit 1
          fi
          mv "${apk_source}" "${APK_NAME}"

          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk_info="$("${build_tools}/aapt" dump badging "${APK_NAME}" | head -n 1)"
          built_package="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" <<< "${apk_info}")"
          built_version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "${apk_info}")"

          if [[ "${built_package}" != 'com.heyanle.easybangumi4' ]]; then
            echo "::error::Unexpected applicationId: ${built_package}"
            exit 1
          fi
          if [[ "${built_version}" != "${BANGUMI_VERSION}" ]]; then
            echo "::error::Built APK version ${built_version} does not match ${BANGUMI_VERSION}"
            exit 1
          fi

          "${build_tools}/apksigner" verify --verbose --print-certs "${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK_NAME}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "EasyBangumi ${BANGUMI_VERSION}" \
              --draft=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" "${APK_NAME}#EasyBangumi ${BANGUMI_VERSION}" \
              --verify-tag \
              --title "EasyBangumi ${BANGUMI_VERSION}" \
              --generate-notes \
              --latest
          fi

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f app/easybangumi.jks
